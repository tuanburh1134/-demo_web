<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web Java cơ bản</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
        }
        h1 { color: #007bff; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Xin chào! 🚀</h1>
        <p th:text="${message}">Nội dung hiển thị tại đây...</p>
    </div>
</body>
</html>
